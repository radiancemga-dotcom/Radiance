# Configuração do projeto Supabase (CLI). Substitua project_id pelo ref do seu projeto.
project_id = "sxoxnpstmbebpluxtpvp"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "https://SEU-SITE.netlify.app"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

# Para habilitar o login com Google, preencha as credenciais do Google Cloud
# (OAuth client) e use as variáveis de ambiente abaixo no painel do Supabase.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = ""

[functions.send-notification]
verify_jwt = false
